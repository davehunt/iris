name: Iris checks

on:
  pull_request:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline test dependencies
        run: |
          python -m pip install pubnub==10.8.1 packaging==26.3 -r requirements-dev.txt
          python -m pip install --no-deps blinkt==0.1.2 buttonshim==0.0.2
      - name: Run offline tests and scoped lint
        run: |
          python -B -m unittest discover -s tests -v
          ruff check --isolated --select E4,E7,E9,F src/iris.py check_dependencies.py update_iris.py tests
          sh -n start.sh
          git diff --check
